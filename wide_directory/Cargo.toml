[package]
name = "wide_directory"
version = "0.1.0"
description = "Flags a source directory with more members than a configured limit"
edition = "2024"
license = "MIT"
repository = "https://github.com/gabrielkoerich/dylint-lints"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dylint_linting = "6.3"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
dylint_testing = "6.3"

# Built on its own nightly, outside the projects that load it
[workspace]

[package.metadata.rust-analyzer]
rustc_private = true
